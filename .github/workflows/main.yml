# ═══════════════════════════════════════════════════════════════════════
#  Pipeline CI/CD — Inventario (API + Frontend)   · Proyecto Parcial 2
#
#  git push a main
#     ├─ 1a. Pruebas unitarias (Jest)  ─┐
#     └─ 1b. Pruebas E2E (Playwright)  ─┤──► si TODO pasa ─► 2. Imagen Docker Hub
#                                       │                   ─► 3. Despliegue EC2
#                                       └──► si algo falla ─► despliegue BLOQUEADO
#
#  Cada resultado (éxito/fallo, commit, rama, usuario) y cada despliegue
#  se registra en OpenObserve (stream "cicd") vía API HTTP/JSON.
#
#  Secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN, EC2_HOST, EC2_USERNAME,
#           EC2_SSH_KEY, OPENOBSERVE_URL, OPENOBSERVE_AUTH
# ═══════════════════════════════════════════════════════════════════════
name: CI/CD - Pruebas + Docker Hub + AWS EC2 + OpenObserve

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: webapp
  CONTAINER_NAME: webapp-container
  OPENOBSERVE_URL: ${{ secrets.OPENOBSERVE_URL }}
  OPENOBSERVE_AUTH: ${{ secrets.OPENOBSERVE_AUTH }}
  COMMIT_MESSAGE: ${{ github.event.head_commit.message }}

jobs:
  # ─────────────────────── 1a. Pruebas unitarias (Jest) ───────────────────────
  test:
    name: Pruebas unitarias (Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar Jest con cobertura (umbral 70%)
        run: npm test -- --json --outputFile=jest-resultados.json

      - name: Publicar resumen de cobertura
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const t = require("./coverage/coverage-summary.json").total;
              const fila = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
              console.log("## Cobertura de código (Jest)\n");
              console.log("| Métrica | % | Cubiertas/Total |\n|---|---|---|");
              ["statements","branches","functions","lines"].forEach(k => console.log(fila(k)));
            ' | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Registrar resultado en OpenObserve
        if: always()
        run: |
          RESULTADO=$([ "${{ job.status }}" = "success" ] && echo exito || echo fallo)
          EXTRA='{}'
          if [ -f jest-resultados.json ]; then
            EXTRA=$(jq '{framework:"jest", total:.numTotalTests, aprobadas:.numPassedTests, fallidas:.numFailedTests}' jest-resultados.json)
          fi
          bash scripts/reportar-openobserve.sh pruebas_unitarias "$RESULTADO" "$EXTRA"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ─────────────────── 1b. Pruebas E2E Frontend + API (Playwright) ───────────────────
  e2e:
    name: Pruebas E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar navegador Chromium
        run: npx playwright install --with-deps chromium

      - name: Ejecutar suite Playwright (frontend + API)
        run: npm run test:e2e

      - name: Resumen de Playwright
        if: always()
        run: |
          F=playwright-report/resultados.json
          if [ -f "$F" ]; then
            {
              echo "## Pruebas E2E (Playwright)"
              echo ""
              echo "| Aprobadas | Fallidas | Inestables | Omitidas |"
              echo "|---|---|---|---|"
              jq -r '.stats | "| \(.expected) | \(.unexpected) | \(.flaky) | \(.skipped) |"' "$F"
              FALLAS=$(jq -r '[.. | objects | select(has("ok") and has("tests") and .ok == false) | "- ❌ " + .title] | .[]' "$F")
               if [ -n "$FALLAS" ]; then
                echo ""
                echo "**Pruebas fallidas:**"
                echo "$FALLAS"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Registrar resultado en OpenObserve
        if: always()
        run: |
          RESULTADO=$([ "${{ job.status }}" = "success" ] && echo exito || echo fallo)
          EXTRA='{}'
          F=playwright-report/resultados.json
          if [ -f "$F" ]; then
            EXTRA=$(jq '{
              framework: "playwright",
              total: (.stats.expected + .stats.unexpected + .stats.flaky + .stats.skipped),
              aprobadas: .stats.expected,
              fallidas: .stats.unexpected,
              duracion_ms: (.stats.duration | floor),
              pruebas_fallidas: ([.. | objects | select(has("ok") and has("tests") and .ok == false) | .title] | join(" | "))
            }' "$F")
          fi
          bash scripts/reportar-openobserve.sh pruebas_e2e "$RESULTADO" "$EXTRA"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ─────────────── Si alguna prueba falla: se registra el bloqueo ───────────────
  bloqueo:
    name: Despliegue bloqueado
    needs: [test, e2e]
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Registrar incidente en OpenObserve
        run: |
          bash scripts/reportar-openobserve.sh despliegue_bloqueado fallo \
            '{"motivo":"Las pruebas no pasaron; no se abrió conexión SSH hacia EC2","jest":"${{ needs.test.result }}","playwright":"${{ needs.e2e.result }}"}'
          echo "### ⛔ Despliegue bloqueado: las pruebas fallaron, no se conectó a EC2" >> "$GITHUB_STEP_SUMMARY"

  # ─────────────────────── 2. Imagen Docker (solo si TODO pasó) ───────────────────────
  build-and-push:
    name: Build & push a Docker Hub
    needs: [test, e2e]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Construir y publicar (:latest y :<sha>)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────── 3. Despliegue en EC2 ───────────────────────────
  deploy-ec2:
    name: Desplegar en AWS EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Desplegar vía SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
            NAME="${{ env.CONTAINER_NAME }}"

            echo "▶ Descargando $IMAGE"
            sudo docker pull "$IMAGE"

            sudo docker network inspect observabilidad >/dev/null 2>&1 || sudo docker network create observabilidad

            echo "▶ Reemplazando contenedor"
            sudo docker stop "$NAME" 2>/dev/null || true
            sudo docker rm "$NAME" 2>/dev/null || true
            sudo docker run -d --name "$NAME" \
              --restart unless-stopped \
              --network observabilidad \
              -p 80:8080 -p 6061:6061 \
              -v webapp-data:/app/data \
              -v webapp-backups:/app/backups \
              "$IMAGE"

            echo "▶ Limpiando imágenes antiguas"
            sudo docker image prune -af --filter "until=24h" || true
            sudo docker ps

      - name: Verificar que la app pública responde con el nuevo commit
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          for i in $(seq 1 15); do
            RESP=$(curl -fsS "http://$EC2_HOST/api" || true)
            if echo "$RESP" | grep -q "${{ github.sha }}"; then
              echo "✅ API en línea con el commit ${{ github.sha }}"
              curl -fsS "http://$EC2_HOST/" | grep -q "Inventario de Productos" && echo "✅ Frontend en línea"
              echo "### ✅ Despliegue verificado: commit \`${GITHUB_SHA::7}\` en http://$EC2_HOST" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Intento $i: aún no responde la nueva versión, reintentando en 4s..."
            sleep 4
          done
          echo "❌ La API no respondió con el commit esperado"
          exit 1

      - name: Registrar despliegue en OpenObserve
        if: always()
        run: |
          RESULTADO=$([ "${{ job.status }}" = "success" ] && echo exito || echo fallo)
          bash scripts/reportar-openobserve.sh despliegue "$RESULTADO" \
            '{"servidor":"${{ secrets.EC2_HOST }}","imagen":"${{ env.IMAGE_NAME }}:${{ github.sha }}"}'
