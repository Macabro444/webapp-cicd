<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventario de Productos</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <h1 data-testid="titulo">Inventario de Productos</h1>
    <span id="estado-api" class="estado" data-testid="estado-api">Conectando…</span>
  </header>

  <main>
    <section class="card">
      <h2 id="titulo-form" data-testid="titulo-form">Nuevo producto</h2>
      <form id="form-producto" data-testid="form-producto" novalidate>
        <input type="hidden" id="producto-id" />
        <label>Nombre
          <input id="nombre" data-testid="input-nombre" type="text" placeholder="Ej. Teclado mecánico" />
        </label>
        <label>Descripción
          <input id="descripcion" data-testid="input-descripcion" type="text" placeholder="Opcional" />
        </label>
        <div class="fila">
          <label>Precio
            <input id="precio" data-testid="input-precio" type="number" step="0.01" min="0" value="0" />
          </label>
          <label>Stock
            <input id="stock" data-testid="input-stock" type="number" step="1" min="0" value="0" />
          </label>
          <label>Categoría
            <select id="categoria" data-testid="select-categoria"></select>
          </label>
        </div>
        <div class="acciones">
          <button type="submit" id="btn-guardar" data-testid="btn-guardar">Agregar producto</button>
          <button type="button" id="btn-cancelar" data-testid="btn-cancelar" class="secundario" hidden>Cancelar edición</button>
        </div>
        <p id="mensaje" data-testid="mensaje" class="mensaje" role="status"></p>
      </form>
    </section>

    <section class="card">
      <h2>Categorías</h2>
      <form id="form-categoria" data-testid="form-categoria" class="fila" novalidate>
        <input id="nueva-categoria" data-testid="input-categoria" type="text" placeholder="Nueva categoría" />
        <button type="submit" data-testid="btn-agregar-categoria">Agregar categoría</button>
      </form>
    </section>

    <section class="card">
      <div class="cabecera-lista">
        <h2>Productos (<span id="total" data-testid="total-productos">0</span>)</h2>
        <input id="buscar" data-testid="input-buscar" type="search" placeholder="Buscar por nombre…" />
      </div>
      <table data-testid="tabla-productos">
        <thead>
          <tr><th>ID</th><th>Nombre</th><th>Categoría</th><th>Precio</th><th>Stock</th><th></th></tr>
        </thead>
        <tbody id="lista"></tbody>
      </table>
      <p id="vacio" data-testid="lista-vacia" class="vacio">No hay productos registrados.</p>
    </section>
  </main>

  <script src="/main.js"></script>
</body>
</html>
